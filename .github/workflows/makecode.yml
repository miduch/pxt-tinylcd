name: MakeCode

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pxt
        run: |
          npm install -g pxt
          pxt target microbit
      - name: Build
        run: |
          pxt install
          pxt build --cloud
